<svg viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="950" fill="#0f172a"/>

  <text x="700" y="45" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">Scalable Blog Application — AWS Architecture</text>
  <text x="700" y="72" text-anchor="middle" fill="#94a3b8" font-size="14">Networking · Compute · Storage · Serverless · Security · Monitoring · IaC</text>

  <!-- User -->
  <circle cx="90" cy="150" r="28" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="155" text-anchor="middle" fill="#e2e8f0" font-size="12">User</text>

  <!-- Route 53 -->
  <rect x="180" y="120" width="140" height="60" rx="8" fill="#7c3aed" opacity="0.85"/>
  <text x="250" y="145" text-anchor="middle" fill="white" font-size="13" font-weight="600">Route 53</text>
  <text x="250" y="163" text-anchor="middle" fill="#e9d5ff" font-size="11">Custom Domain</text>

  <line x1="118" y1="150" x2="178" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CloudFront -->
  <rect x="370" y="60" width="150" height="60" rx="8" fill="#0891b2" opacity="0.9"/>
  <text x="445" y="85" text-anchor="middle" fill="white" font-size="13" font-weight="600">CloudFront</text>
  <text x="445" y="103" text-anchor="middle" fill="#cffafe" font-size="11">Global CDN</text>

  <!-- WAF -->
  <rect x="370" y="180" width="150" height="60" rx="8" fill="#dc2626" opacity="0.85"/>
  <text x="445" y="205" text-anchor="middle" fill="white" font-size="13" font-weight="600">AWS WAF</text>
  <text x="445" y="223" text-anchor="middle" fill="#fecaca" font-size="11">Traffic filtering</text>

  <line x1="320" y1="140" x2="370" y2="95" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="160" x2="370" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ALB -->
  <rect x="560" y="180" width="150" height="60" rx="8" fill="#ea580c" opacity="0.9"/>
  <text x="635" y="205" text-anchor="middle" fill="white" font-size="13" font-weight="600">ALB</text>
  <text x="635" y="223" text-anchor="middle" fill="#fed7aa" font-size="11">Load Balancer</text>

  <line x1="520" y1="210" x2="560" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VPC box -->
  <rect x="560" y="280" width="450" height="280" rx="10" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="580" y="305" fill="#94a3b8" font-size="13" font-weight="600">VPC (Public + Private Subnets)</text>

  <!-- EC2 -->
  <rect x="590" y="330" width="150" height="70" rx="8" fill="#ea580c" opacity="0.9"/>
  <text x="665" y="358" text-anchor="middle" fill="white" font-size="13" font-weight="600">EC2</text>
  <text x="665" y="376" text-anchor="middle" fill="#fed7aa" font-size="11">Web Server + EBS</text>

  <line x1="635" y1="240" x2="665" y2="330" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RDS -->
  <rect x="850" y="330" width="150" height="70" rx="8" fill="#16a34a" opacity="0.9"/>
  <text x="925" y="358" text-anchor="middle" fill="white" font-size="13" font-weight="600">RDS MySQL</text>
  <text x="925" y="376" text-anchor="middle" fill="#bbf7d0" font-size="11">Private subnet</text>

  <line x1="740" y1="365" x2="850" y2="365" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- IAM -->
  <rect x="590" y="440" width="150" height="60" rx="8" fill="#334155"/>
  <text x="665" y="465" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">IAM</text>
  <text x="665" y="483" text-anchor="middle" fill="#cbd5e1" font-size="11">MFA + policies</text>

  <!-- KMS -->
  <rect x="850" y="440" width="150" height="60" rx="8" fill="#334155"/>
  <text x="925" y="465" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">KMS</text>
  <text x="925" y="483" text-anchor="middle" fill="#cbd5e1" font-size="11">Encryption at rest</text>

  <!-- S3 -->
  <rect x="370" y="330" width="150" height="70" rx="8" fill="#16a34a" opacity="0.9"/>
  <text x="445" y="358" text-anchor="middle" fill="white" font-size="13" font-weight="600">S3 Bucket</text>
  <text x="445" y="376" text-anchor="middle" fill="#bbf7d0" font-size="11">Versioned + Encrypted</text>

  <line x1="445" y1="120" x2="445" y2="330" stroke="#555" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- Lambda -->
  <rect x="180" y="330" width="150" height="70" rx="8" fill="#ca8a04" opacity="0.9"/>
  <text x="255" y="358" text-anchor="middle" fill="white" font-size="13" font-weight="600">Lambda</text>
  <text x="255" y="376" text-anchor="middle" fill="#fef08a" font-size="11">Image resize on upload</text>

  <line x1="370" y1="365" x2="330" y2="365" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SNS / SQS -->
  <rect x="180" y="440" width="150" height="60" rx="8" fill="#ca8a04" opacity="0.9"/>
  <text x="255" y="465" text-anchor="middle" fill="white" font-size="13" font-weight="600">SNS</text>
  <text x="255" y="483" text-anchor="middle" fill="#fef08a" font-size="11">Post notifications</text>

  <rect x="370" y="440" width="150" height="60" rx="8" fill="#ca8a04" opacity="0.9"/>
  <text x="445" y="465" text-anchor="middle" fill="white" font-size="13" font-weight="600">SQS</text>
  <text x="445" y="483" text-anchor="middle" fill="#fef08a" font-size="11">Background tasks</text>

  <line x1="665" y1="400" x2="300" y2="440" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="665" y1="400" x2="445" y2="440" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CloudWatch -->
  <rect x="1050" y="330" width="170" height="170" rx="8" fill="#7c3aed" opacity="0.8"/>
  <text x="1135" y="358" text-anchor="middle" fill="white" font-size="13" font-weight="600">CloudWatch</text>
  <text x="1135" y="378" text-anchor="middle" fill="#e9d5ff" font-size="11">Alarms + Logs</text>
  <text x="1135" y="410" text-anchor="middle" fill="#ddd6fe" font-size="10">Monitors:</text>
  <text x="1135" y="428" text-anchor="middle" fill="#ddd6fe" font-size="10">EC2 · RDS · Lambda</text>

  <line x1="1000" y1="365" x2="1050" y2="365" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- IaC footer -->
  <rect x="560" y="600" width="600" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="860" y="626" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">CloudFormation (IaC)</text>
  <text x="860" y="645" text-anchor="middle" fill="#94a3b8" font-size="11">Provisions S3 bucket · Deployed via AWS CLI</text>

  <!-- Legend -->
  <text x="90" y="700" fill="#94a3b8" font-size="13" font-weight="600">Legend</text>
  <rect x="90" y="715" width="16" height="16" fill="#ea580c"/><text x="115" y="728" fill="#cbd5e1" font-size="12">Compute / Networking</text>
  <rect x="90" y="740" width="16" height="16" fill="#16a34a"/><text x="115" y="753" fill="#cbd5e1" font-size="12">Storage / Database</text>
  <rect x="90" y="765" width="16" height="16" fill="#ca8a04"/><text x="115" y="778" fill="#cbd5e1" font-size="12">Serverless / Decoupling</text>
  <rect x="90" y="790" width="16" height="16" fill="#0891b2"/><text x="115" y="803" fill="#cbd5e1" font-size="12">Delivery (CDN/DNS)</text>
  <rect x="90" y="815" width="16" height="16" fill="#dc2626"/><text x="115" y="828" fill="#cbd5e1" font-size="12">Security</text>
  <rect x="90" y="840" width="16" height="16" fill="#7c3aed"/><text x="115" y="853" fill="#cbd5e1" font-size="12">Monitoring</text>
  <rect x="90" y="865" width="16" height="16" fill="#334155"/><text x="115" y="878" fill="#cbd5e1" font-size="12">Identity / Encryption</text>

</svg>
